# Serves the built SPA and proxies the two paths the dev server proxies
# (frontend/vite.config.ts) to the backend. Runs as the unprivileged app user:
# every writable path is under /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;
  client_max_body_size  25m;   # master resume upload

  server {
    listen 8080;
    root /app/frontend;

    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $http_host;
      proxy_read_timeout 300s;
    }
    # Trailing slash matters, as in vite.config.ts: '/resumes' is an SPA route.
    location /resume/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $http_host;
    }
    location / {
      try_files $uri /index.html;
    }
  }
}
